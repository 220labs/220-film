# The people in 220, credited as they asked to be. The roll reads this file: `@credits with` and
# `@credits also` in a cut list's roll become the sections below (scripts/cut.py, with_credits).
#
# You appear in the film and want your credit added or corrected: open a pull request that changes
# your own line, with your name as you want it shown. A merged credit goes into the YouTube
# description and a pinned comment the same day, and onto the roll at the next upload.
# To be removed or blurred instead, write to the contact in LICENSE.md; that is not a pull request.
#
# section: with  - the three friends the film follows, on one line
#          also  - everyone else in the film, one line each, with an optional note under the name
# The names here are part of the film, not of the MIT recipe (LICENSE.md).
people:
  - name: Ilya Fomin
    section: with
  - name: Zhan Petrov
    section: with
  - name: Bogdan Barchuk
    section: with
  - name: Sara Emmett
    section: also
    note: who made the coffee
  - name: Gina
    section: also
    note: brand ambassador
