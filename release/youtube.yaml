    file: 220-teaser-v5.mp4
    title: "Open-source film: Google Gemini workshop at NASA, edited by AI | 220"
    privacy: public
    description: |
      An open-source film: a Google Gemini workshop at NASA Ames, and the AI agents that kept working the whole day. Edited by AI.

      220 is a documentary shot on two phones on 2026-10-08 at Hangar One, NASA Ames Research Center, at Gemini at Work. Three friends present and argue about AI agent workflows. Intercut with the room is the day nobody in it could see: Ilya's Claude agents working on their own, in their own words, on screen as they wrote them.

      The AI in the film is real. Nothing in the footage is edited in content, and the agents' lines are shown verbatim with their real times.

      Full film premieres today, 11:11 PT: https://youtu.be/5zSqs-3qyg4
      Open source: the cut list, scripts and credits (not the footage): https://github.com/220labs/220-film
