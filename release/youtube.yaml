      Directed and produced by: Ilya Fomin, Zhan Petrov and Claude Opus 5.5 (Anthropic).
      Director of photography: Zhan Petrov.
      Edited by: Claude Opus 5.5 (Anthropic) — Zhan Petrov aggressive Netflix-doc trailer cut (edl/trailer-zhan-v1.yaml).
      Music: AI-generated stand-ins, Google Flow Music (CC0), continuous stem mix.

