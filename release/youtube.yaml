  trailer-zhan-v1:
    id:
    file: cuts/220-trailer-zhan-netflix.mp4       # cut.py edl/trailer-zhan-v1.yaml at 11bd1ce
    title: "220 | Official Trailer (Zhan Petrov Cut) | An AI Autobiography"
    description: |
      "You're the middleman." — What happens when a filmmaker, an engineer, and 53 autonomous AI agents walk into NASA Ames Hangar One?

      An aggressive, high-velocity Netflix-style documentary trailer for 220, cut in the signature style of director of photography and co-director Zhan Petrov.

      Shot on two phones and a pair of camera glasses on 2026-10-08 at Hangar One, NASA Ames Research Center, during Google's Gemini at Work workshop. While the room teaches developers to copy and paste code from a browser tab, Zhan Petrov challenges Google engineers on the floor, Bogdan Barchuk debates the human-in-the-loop bottleneck, and Ilya Fomin's autonomous Claude agents quietly build a working 220-volt circuit breaker in 29 minutes—and then edit the film itself.

      The AI in the film is real. Nothing in the footage is staged, and the agents' lines appear verbatim with their real timestamps.

      TRAILER CHAPTERS
      0:00 Cold Open: "You're the Middleman"
      0:27 Inside Hangar One: The Hype vs. The Floor
      0:59 The Friction: "Yesterday's Day" & The Copy-Paste Lab
      1:39 The Escalation: 29 Minutes to Build the 220 Breaker
      2:15 Climax: An Open-Source Film About AI, Edited by AI

      Watch the full film (v0.1): https://youtu.be/XKJ-gWXQKVU
      220 Labs: https://220labs.dev/
      Open-source recipe, EDL & credits (MIT): https://github.com/220labs/220-film
