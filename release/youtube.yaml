# 220's YouTube videos, as they are LIVE on @220film (channel UC2WOr2KjkSog-miU4IaMyWQ), read 2026-10-11 with the tool's
# own client (channels.list, playlistItems.list, videos.list; nothing written). `bin/tool youtube apply --dry-run` reports
# no change against it. This file is the truth for what is live; to change a video, edit it here and run apply (in CI:
# .github/workflows/youtube.yml).
# A published version is never altered (scripts/frozen.py and release/frozen.tsv hold it so): the two v0.0 entries are that first read, as published,
# put back on YouTube on 2026-10-11 after a day of edits (the film's full description, category 1, the v0.1 titles and
# forward links), and are never edited again. Not declared on them, so apply never sends any: thumbnails and captions
# (a file declared but never recorded in youtube.state.json would be sent on the first real apply: a write, not a
# no-op); tags (none live); synthetic (the API does not return it). The v0.1 entries (uploaded 2026-10-11, premiered 11:11
# PT, frozen as live that evening) declare all of them: the upload recorded their hashes in youtube.state.json. Playlists: none. Shape: the header of
# scripts/release/youtube.py in 220labs/griptruck.
