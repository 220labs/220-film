  film:
    id: 5zSqs-3qyg4
    file: 220-clean-v5.mp4
    title: "Open-source film: Google Gemini at NASA, edited by AI | 220"
    privacy: public
    description: |
      220 is an open-source film about a Google Gemini workshop at NASA Ames and the Claude agents that worked through the same day. A film about AI, edited by AI. The AI in it is real. As far as we could find, it is the first documentary edited by the AI in it (prior-art search of 2026-10-11: https://github.com/220labs/220-film/blob/main/FIRSTS.md; know an earlier one? open a pull request).

      One day, 2026-10-08, 08:35 to 16:01, Hangar One, NASA Ames Research Center, Gemini at Work. Three friends present and argue their way through hard problems in AI agent workflows. Intercut, the day nobody in the room could see: Ilya's Claude agents working on their own, sessions blocking each other, hooks shouting in capitals, a tool built, merged and made public while the workshop went on. Two worlds, one clock.

      Nothing in the source is edited. Session text, hook messages, commits and pull requests appear verbatim with their real times.

      CHAPTERS
      0:00 Cold open
      0:30 Prologue: in which the machines work through the night
      0:56 Chapter one: in which three friends go to NASA
      3:07 Chapter two: in which Google makes a cloud indoors
      4:32 Chapter three: in which everyone is selling something
      8:23 Chapter four: in which the lab teaches them to copy and paste
      12:29 Chapter five: in which a breaker is built in 29 minutes
      23:08 Chapter six: in which the computer goes to sleep
      23:25 Epilogue: in which the film is made

      CREDITS
      With: Ilya Fomin, Zhan Petrov and Bogdan Barchuk.
      Also in the film: Sara Emmett, who made the coffee, and Gina, brand ambassador.
      Directed and produced by: Ilya Fomin, Zhan Petrov and Claude Opus 5.5 (Anthropic). Director of photography: Zhan Petrov. Shot by the three of them, on two phones and a pair of camera glasses.
      Edited by: Claude Opus 5.5 (Anthropic), which chose every cut and wrote the cut list, the renderer and the credit roll; also titles and motion graphics, sound design and mix, and music supervision.
      Also made with: Claude Sonnet 5.5 (subtitles and translation, research); Claude Fable 5.1 (story consultant); Whisper large-v3-turbo (transcription). Music: AI-generated stand-ins, Google Flow Music, labelled in the film.
      In the film: Claude Opus 5.5, Sonnet 5.5 and Fable 5.1, Anthropic, as the agents of the day (53 Claude Code sessions); Gemini, Google, as the subject of the workshop.
      Claude tokens: spacesheep.dev, Ilya Fomin, Zhan Petrov, Rob Nilsson Art Forms.
      Keynote, quoted for commentary: Sundar Pichai, Google (Gemini at Work '26, Hangar One, (c) Google). He did not take part in this film and has not endorsed it.
      Open source: the recipe, meaning the cut list and the scripts that render this film (MIT), and the credits, which anyone in the film can add to or correct by pull request: https://github.com/220labs/220-film
      The footage, faces and voices are not open (see LICENCE). Film page: https://ffpp.pictures/220/

      LICENCE
      The film, its footage, faces, voices and the words spoken in it are (c) 2026 the filmmakers and the people in it. All rights reserved. No reuse, no remix, no re-upload, no use as data for training, fine-tuning or evaluating any machine-learning model, and no synthetic likeness or voice made from it. Each person in the film keeps their own rights in their likeness and voice. Keynote excerpts are (c) Google, quoted for commentary. Permission requests: hello@ffpp.pictures.

