# 220's YouTube videos, as they are LIVE on @220film (channel UC2WOr2KjkSog-miU4IaMyWQ), read 2026-10-11 with the tool's
# own client (channels.list, playlistItems.list, videos.list; nothing written). `bin/tool youtube apply --dry-run` reports
# no change against it. Then, the same day, the film took its full description (chapters, credits, licence) and both
# videos category 1, Film & Animation. This file is the truth for what is live; to change a video, edit it here and run
# apply (in CI: .github/workflows/youtube.yml).
# Not declared, on purpose: thumbnails and captions (their files are not under the media root, and a file declared but
# never recorded in youtube.state.json would be sent on the first real apply: a write, not a no-op); tags (none live);
# playlists (none live); synthetic (the API does not return it, so the live answer is unknown). Shape: the header of
# scripts/release/youtube.py in 220labs/griptruck.
channel: UC2WOr2KjkSog-miU4IaMyWQ
defaults: {category: 1, language: en, privacy: private, made_for_kids: false, license: youtube, notify: false}
videos:
